<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer gradient circle -->
  <defs>
    <radialGradient id="ltGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7dd3fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </radialGradient>
    <filter id="ltShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#ltGradient)" filter="url(#ltShadow)" />

  <!-- Inner subtle circle for depth -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2" />

  <!-- "LT" text -->
  <text
    x="100"
    y="115"
    font-family="'Space Grotesk', system-ui, sans-serif"
    font-size="72"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-2"
    dominant-baseline="middle"
  >LT</text>

  <!-- Decorative accent dot -->
  <circle cx="155" cy="65" r="4" fill="#ffffff" opacity="0.8" />
</svg>